name: Theme checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: PHP syntax
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - name: Request language and URL boundaries
        run: php tests/language.php
      - name: Scoped popup presentation
        run: node tests/presentation.mjs
      - name: Installer shell syntax
        run: bash -n scripts/install-languages.sh
